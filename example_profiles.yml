default:
  target: dev
  outputs:
    dev:
      type: bigquery
      threads: 32 #How many concurrent dbt requests to bigquery
      database: dbt-training-1245678 #the bigquery project ID, where we will create objects
      schema: dbt_oclarke #need to provide unique options based on initials
      method: service-account
      keyfile: .secrets/keyfilename.json #change to the actual filepath
      location: EU #change to location of BigQuery project
