version: 2

models:
  - name: int_successful_payments
    description: "Staging Payments table, filtered only to successful payments"
    columns:
      - name: payment_id
        description: "Primary Key of table"

      - name: order_id
        description: "Order ID, Primary Key of the orders table - foreign key in this table"

      - name: payment_method
        description: "The method used to pay for the sandwich, one of:\n\n| method | Description |\n|:---|:---|\n| bank_transfer | Payment via BACS |\n| coupon | Used one of our coupons\n| credit_card | Payment via credit **or debit** card|\n| gift_card | Used on of our gift cards |"

      - name: payment_status
        description: ""

      - name: order_value_dollars
        description: "Raw amount in cents, converted into dollars"

      - name: payment_date
        description: ""
