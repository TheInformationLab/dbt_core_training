version: 2

models:
  - name: stg_stripe__payments
    description: ""
    columns:
      - name: payment_id
        description: "{{doc('payment_id')}}"
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: ""

      - name: payment_method
        description: "{{doc('payment_method')}}"

      - name: payment_status
        description: ""

      - name: order_value_dollars
        description: "Payment amount converted to dollars and rounded to 2 dp"

      - name: payment_date
        description: ""

  - name: stg_stripe__successful_payments
    description: ""
    columns:
      - name: order_id
        description: ""

      - name: order_value_dollars
        description: "Payment amount converted to dollars and rounded to 2 dp"

      - name: payment_date
        description: ""

      - name: payment_id
        description: "{{doc('payment_id')}}"
        data_tests:
          - unique
          - not_null

      - name: payment_method
        description: "{{doc('payment_method')}}"

      - name: payment_status
        description: ""
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - success
