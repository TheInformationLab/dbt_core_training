version: 2

sources:
  - name: jaffle_shop
    tables:
      - name: orders
        columns:
          - name: id
            data_type: int64
          - name: user_id
            data_type: int64
          - name: order_date
            data_type: date
          - name: status
            data_type: string
          - name: _etl_loaded_at
            data_type: datetime

      - name: customers
        columns:
          - name: id
            data_type: int64
          - name: first_name
            data_type: string
          - name: last_name
            data_type: string
